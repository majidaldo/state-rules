# https://github.com/acarapetis/jj-pre-push?tab=readme-ov-file
#[aliases]
#push = ["util", "exec", "--", "uvx", "jj-pre-push", "push"]

default_install_hook_types:
  - pre-commit
  - pre-push
  - prepare-commit-msg
default_stages:
  - pre-commit

repos:
-   repo: local
    hooks:
    - id: bump-ver
      name: bump version
      language: system
      entry: python tasks.py build --commit=True --update=True
      pass_filenames: false
      stages:
        - pre-push
