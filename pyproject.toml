[project]
name = "state-rules"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.20.4",
    "pyzmq>=27.1.0",
]

[dependency-groups]
dev = [
    "marimo", "pyzmq",
]

[project.scripts]
dyrules = "state_rules:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
